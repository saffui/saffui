[package]
name = "services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# What happens between a request and a row: establishing a caller, gathering the
# facts a decision reads, and reaching a decision. Neither SQL nor HTTP.
#
# No web framework here, deliberately. A layer that could hold a request object
# ends up holding one, and then the decision that reads it cannot be called by
# anything that is not serving HTTP. What this crate knows about a caller is
# what a decision needs to know, and the transport keeps the rest.

[dependencies]
commons = { workspace = true }
models = { workspace = true }
crypto = { workspace = true }
store = { workspace = true }
# The relying party a credential is scoped to is built from the deployment's
# own origin, never from anything a request carried.
config = { workspace = true }
authz = { workspace = true }

chrono = { workspace = true }
serde_json = { workspace = true }
deadpool-postgres = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
# Hex for the code digest a redemption looks a row up by, base64url for the
# PKCE challenge, both spelled by the specs that fixed them.
data-encoding = { workspace = true }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
url.workspace = true
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
# The context tests establish a caller against a real schema, so the test side
# reaches the migration runner and the software crypto provider directly.
pgcore = { workspace = true }
crypto = { workspace = true }
tokio-postgres = { workspace = true }
serde_json = { workspace = true }
