[package]
name = "saffui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "saffui"
path = "src/main.rs"

[features]
# The desktop-ticket door, passed through to the server crate: the binding
# links the system Kerberos libraries, so a deployment asks for it by name.
kerberos = ["server/kerberos"]

[dependencies]
commons = { workspace = true, features = ["http", "request-span"] }
config = { workspace = true }
ldapfront = { path = "../ldapfront" }
openssl = { workspace = true }
# The deployment wrapping key is opened here, at startup, so a missing one stops
# the process instead of every mint it was asked for later.
crypto = { workspace = true }
secrecy = { workspace = true }
pgcore = { workspace = true }
server = { workspace = true }
# Provisioning: what a deployment needs before anybody can log in.
services = { workspace = true }
store = { workspace = true }
models = { workspace = true }
chrono = { workspace = true }

actix-web = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
serde = { workspace = true }
serde_json = { workspace = true }
# The CLI half of this binary talks to the plane it also serves; blocking on
# purpose, since a command is one call and an answer.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
deadpool-postgres = { workspace = true }
tokio-postgres = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
