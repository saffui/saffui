[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
license      = "Apache-2.0"
repository   = "https://github.com/saffui/saffui"
authors      = ["Kodjo Touglo <micheltouglo@gmail.com>"]

[workspace.dependencies]
# Internal crates: the path is declared once here; members pull them with
# `{ workspace = true }`, so adding or moving a crate is a one-line change.
commons = { path = "crates/commons" }
crypto  = { path = "crates/crypto" }
config  = { path = "crates/config" }
pgcore  = { path = "crates/pgcore" }
models  = { path = "crates/models" }
store   = { path = "crates/store" }
authz   = { path = "crates/authz" }
auth    = { path = "crates/auth" }
services       = { path = "crates/services" }
server         = { path = "crates/server" }
saffui         = { path = "crates/saffui" }

# External: one version per dependency across the whole workspace.
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order is REQUIRED by the vendored JOSE code: JSON member order is
# part of the signed material, so a BTreeMap-backed Value would change what gets
# signed and break RFC 7638 thumbprints.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio          = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
thiserror      = "2.0.19"

# --- Domain models ---
# Timestamps on every audited row; `serde` so an API response carries RFC 3339
# rather than a count of seconds nobody can read.
chrono = { version = "0.4.42", features = ["serde"] }
# Derives ToSql/FromSql for the enums that are PostgreSQL enum types, so the
# database refuses a value the Rust side cannot name and vice versa.
postgres-types = { version = "0.2.11", features = ["derive", "with-serde_json-1", "with-chrono-0_4"] }
# Query-string assembly for a brokered authorization request: a configured value
# holding & or = must not be able to inject a parameter.
url = "2.5"

# --- HTTP ---
# Only the layers that serve a request pull these; `commons` gates them behind
# a feature so a crypto unit test does not compile a web framework.
# Default features off, which drops http2 and with it the h2 crate. Nothing here
# serves HTTP: this renders catalogued errors and carries a request span. Adding
# a server means turning http2 back on, and h2 0.3 is what RUSTSEC-2026-0258 is
# about, so check whether actix-http has moved to 0.4 before doing so.
clap           = { version = "4", features = ["derive", "env"] }
# `cookies` is on because the binding between a browser and its login has to be
# something the URL does not carry: a URL reaches server logs, `Referer` headers
# and history, and a login identifier that leaks there is one somebody else can
# answer. Everything else stays off.
actix-web      = { version = "4.14", default-features = false, features = ["macros", "cookies"] }
log            = "0.4"

# --- Observability ---
# The subscriber stack is what a binary installs once; a library only ever
# emits. Behind a feature so a crypto unit test compiles none of it.
tracing              = "0.1.44"
tracing-subscriber   = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-log          = "0.2.0"
tracing-actix-web    = "0.7.22"
openssl        = "0.10.81"
# The raw FFI, for the post-quantum algorithms the safe crate has no bindings
# for yet. Pinned to what `openssl` already resolves to, so there is one
# libcrypto and one set of headers rather than two.
openssl-sys    = "0.9.117"
tokio-openssl  = "0.6"
# Only for `ForeignType`, which is how a raw `EVP_PKEY` from the FFI above is
# adopted into the safe crate's `PKey`. Pinned to the version `openssl` uses,
# or the trait would be a different trait.
foreign-types  = "0.3.2"

# PKCS#11, for a key store where the private key never leaves the token.
cryptoki       = "0.12"
tokio-postgres = "0.7.18"
# One TLS stack for the workspace: the OpenSSL already linked by `crypto`,
# reached through postgres-openssl. Never a second one.
postgres-openssl  = "0.5"
deadpool-postgres = "0.14"

# --- Secret material ---
# zeroize wipes buffers on drop; subtle gives constant-time equality. Neither is
# something to hand-roll: a naive `==` short-circuits on the first differing byte
# and leaks how much of a secret an attacker guessed correctly.
zeroize        = { version = "1.8", features = ["derive"] }
subtle         = "2.6"

# --- The CryptoProvider seam ---
# secrecy carries key material through the trait so a `Vec<u8>` cannot be logged
# or copied by accident; async-trait is what lets the key store be a trait
# object, since a PKCS#11 or KMS store answers over I/O.
secrecy        = "0.10"
# SMTP, with the platform TLS the outbound HTTP client already uses. Default
# features off: they pull a second TLS stack and an async runtime this crate
# does not send from.
lettre         = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
email_address  = { version = "0.2", default-features = false }
async-trait    = "0.1"

# --- Password storage ---
# argon2 mints and reads PHC strings; bcrypt is verification only, kept for
# hashes imported from an older system and never used to make new ones.
argon2         = "0.5"
bcrypt         = "0.17"

# --- Encodings ---
# HEXLOWER for random identifiers, BASE32_NOPAD for TOTP shared secrets
# (otpauth:// URIs), BASE64URL_NOPAD for JOSE compact serialization (RFC 7515
# §2 mandates base64url *without* padding — standard base64 breaks the format).
data-encoding  = "2.6"

# --- Required by the vendored josekit JOSE layer (see THIRD-PARTY.md) ---
anyhow         = "1"
regex          = "1"
base64         = "0.22"
flate2         = "1"
time           = "0.3"
