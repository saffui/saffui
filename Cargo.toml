[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.97"
license      = "Apache-2.0"
repository   = "https://github.com/saffui/saffui"
authors      = ["Kodjo Touglo <micheltouglo@gmail.com>"]

[workspace.dependencies]
# Internal crates: the path is declared once here; members pull them with
# `{ workspace = true }`, so adding or moving a crate is a one-line change.
commons = { path = "crates/commons" }
crypto  = { path = "crates/crypto" }

# External: one version per dependency across the whole workspace.
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order is REQUIRED by the vendored JOSE code: JSON member order is
# part of the signed material, so a BTreeMap-backed Value would change what gets
# signed and break RFC 7638 thumbprints.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio          = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
thiserror      = "2.0.19"
openssl        = "0.10.81"
tokio-postgres = "0.7.18"

# --- Secret material ---
# zeroize wipes buffers on drop; subtle gives constant-time equality. Neither is
# something to hand-roll: a naive `==` short-circuits on the first differing byte
# and leaks how much of a secret an attacker guessed correctly.
zeroize        = { version = "1.8", features = ["derive"] }
subtle         = "2.6"

# --- The CryptoProvider seam ---
# secrecy carries key material through the trait so a `Vec<u8>` cannot be logged
# or copied by accident; async-trait is what lets the key store be a trait
# object, since a PKCS#11 or KMS store answers over I/O.
secrecy        = "0.10"
async-trait    = "0.1"

# --- Password storage ---
# argon2 mints and reads PHC strings; bcrypt is verification only, kept for
# hashes imported from an older system and never used to make new ones.
argon2         = "0.5"
bcrypt         = "0.17"

# --- Encodings ---
# HEXLOWER for random identifiers, BASE32_NOPAD for TOTP shared secrets
# (otpauth:// URIs), BASE64URL_NOPAD for JOSE compact serialization (RFC 7515
# §2 mandates base64url *without* padding — standard base64 breaks the format).
data-encoding  = "2.6"

# --- Required by the vendored josekit JOSE layer (see THIRD-PARTY.md) ---
anyhow         = "1"
regex          = "1"
base64         = "0.22"
flate2         = "1"
time           = "0.3"
