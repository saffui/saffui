[package]
name = "auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Who somebody is, and what it took to establish it.
#
# The flow a login walks, the steps that challenge, the credentials that answer,
# and the enrolment that adds one. Nothing here knows where a browser goes
# afterwards: a redirect URI and a response mode belong to the protocol that
# asked for the login, and this crate would have to be rewritten for the next
# protocol if it held them.
#
# Below `services` and above `store`, which is what lets the protocol call
# authentication without authentication calling back.

[dependencies]
qrcode = { workspace = true }
commons = { workspace = true }
models = { workspace = true }
crypto = { workspace = true }
store = { workspace = true }
# The relying party a credential is scoped to is built from the deployment's
# own origin, never from anything a request carried.
config = { workspace = true }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
deadpool-postgres = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
data-encoding = { workspace = true }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
url.workspace = true
uuid = { version = "1", features = ["v5"] }
async-trait = { workspace = true }
tracing.workspace = true
