# saffui under the OpenID conformance suite, on one machine.
#
# The suite's prebuilt images beside the deployment from ../local, with saffui
# behind TLS: the suite refuses any discovery document whose endpoints are not
# https. The certificate is Caddy's own, which the suite's client accepts
# unverified, and `saffui.test` resolves inside this network only.
#
# Needs a checkout of gitlab.com/openid/conformance-suite for the runner
# script: CONFORMANCE_SUITE_DIR=/path/to/it docker compose up runner

services:
  postgres:
    extends:
      file: ../local/compose.yaml
      service: postgres

  migrate:
    extends:
      file: ../local/compose.yaml
      service: migrate
    depends_on:
      postgres:
        condition: service_healthy

  # Three relying parties: the plan presents one while authenticating as
  # another, and runs one through `client_secret_post`.
  provision:
    extends:
      file: ../local/compose.yaml
      service: provision
    command:
      - provision
      - --tenant=local
      - --realm=main
      - --console-redirect=http://localhost:5173/callback
      - --client=conformance
      - --client=conformance-second
      - --client=conformance-post
      - --redirect=https://localhost.emobix.co.uk:8443/test/a/saffui/callback
      - --after-logout=https://localhost.emobix.co.uk:8443/test/a/saffui/post_logout_redirect
      - --user=ada
      - --email=ada@example.test
      - --given-name=Ada
      - --family-name=Lovelace
      - --phone=+33123456789
      - --attribute=user.profile.middle_name=Augusta
      - --attribute=user.profile.nick_name=ada
      - --attribute=user.profile.profile=https://saffui.test/ada
      - --attribute=user.profile.picture=https://saffui.test/ada.png
      - --attribute=user.profile.website=https://saffui.test
      - --attribute=user.profile.gender=female
      - --attribute=user.profile.birthdate=1990-12-10
      - --attribute=user.profile.zoneinfo=Europe/London
      - --attribute=user.profile.locale=en-GB
      - --attribute=user.address.street_address=1 Saint James's Square
      - --attribute=user.address.locality=London
      - --attribute=user.address.region=England
      - --attribute=user.address.postal_code=SW1Y 4JH
      - --attribute=user.address.country=United Kingdom
      - --attribute=user.address.formatted=1 Saint James's Square, London SW1Y 4JH, United Kingdom
    environment:
      SAFFUI_PUBLIC_ORIGIN: https://saffui.test
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Its own client for the back-channel plan: the other plans' modules refuse
  # a logout token they did not ask for, and a registration is per client.
  provision-frontchannel:
    extends:
      file: ../local/compose.yaml
      service: provision
    command:
      - provision
      - --tenant=local
      - --realm=main
      - --client=conformance-frontchannel
      - --redirect=https://localhost.emobix.co.uk:8443/test/a/saffui/callback
      - --after-logout=https://localhost.emobix.co.uk:8443/test/a/saffui/post_logout_redirect
      - --frontchannel-logout=https://localhost.emobix.co.uk:8443/test/a/saffui/frontchannel_logout
    environment:
      SAFFUI_PUBLIC_ORIGIN: https://saffui.test
    depends_on:
      provision:
        condition: service_completed_successfully

  provision-backchannel:
    extends:
      file: ../local/compose.yaml
      service: provision
    command:
      - provision
      - --tenant=local
      - --realm=main
      - --client=conformance-backchannel
      - --redirect=https://localhost.emobix.co.uk:8443/test/a/saffui/callback
      - --after-logout=https://localhost.emobix.co.uk:8443/test/a/saffui/post_logout_redirect
      - --backchannel-logout=https://localhost.emobix.co.uk:8443/test/a/saffui/backchannel_logout
    environment:
      SAFFUI_PUBLIC_ORIGIN: https://saffui.test
    depends_on:
      provision:
        condition: service_completed_successfully

  saffui:
    extends:
      file: ../local/compose.yaml
      service: saffui
    ports: !reset []
    environment:
      SAFFUI_PUBLIC_ORIGIN: https://saffui.test
    volumes:
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    depends_on:
      provision-backchannel:
        condition: service_completed_successfully
      provision-frontchannel:
        condition: service_completed_successfully
      ca-bundle:
        condition: service_completed_successfully

  tls:
    image: caddy:2
    command: ["caddy", "reverse-proxy", "--from", "saffui.test", "--to", "saffui:8080", "--internal-certs"]
    networks:
      default:
        aliases:
          - saffui.test
    depends_on:
      saffui:
        condition: service_healthy

  # A certificate for the name the suite answers to, issued by an authority
  # of this bench's own, and a trust store that holds the authority. The one
  # in the suite's image is for `localhost`, which nothing accepts for
  # `localhost.emobix.co.uk`; a bare self-signed leaf is no authority to a
  # verifier either; and a deployment that skipped the check to get past
  # either would be testing a server nobody should run.
  suite-cert:
    image: alpine/openssl:latest
    entrypoint: ["sh", "-c"]
    command:
      - >
        test -f /certs/suite.crt || (
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650
        -subj "/CN=saffui conformance bench"
        -addext "basicConstraints=critical,CA:TRUE"
        -addext "keyUsage=critical,keyCertSign,cRLSign"
        -keyout /certs/bench-ca.key -out /certs/bench-ca.crt &&
        openssl req -newkey rsa:2048 -nodes
        -subj "/CN=localhost.emobix.co.uk"
        -keyout /certs/suite.key -out /certs/suite.csr &&
        printf "subjectAltName=DNS:localhost.emobix.co.uk,DNS:localhost\nextendedKeyUsage=serverAuth\n" > /certs/suite.ext &&
        openssl x509 -req -days 3650 -in /certs/suite.csr
        -CA /certs/bench-ca.crt -CAkey /certs/bench-ca.key -CAcreateserial
        -extfile /certs/suite.ext -out /certs/suite.crt )
    volumes:
      - ./certs:/certs

  # The deployment's own trust store with that certificate added, built from
  # the image that will use it so nothing else about it changes.
  ca-bundle:
    image: saffui:local
    entrypoint: ["sh", "-c"]
    command:
      - cat /etc/ssl/certs/ca-certificates.crt /certs/bench-ca.crt > /certs/ca-bundle.crt
    volumes:
      - ./certs:/certs
    depends_on:
      suite-cert:
        condition: service_completed_successfully

  mongodb:
    image: mongo:6.0.13

  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:latest
    ports:
      - "8443:8443"
    volumes:
      - ./certs/suite.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ./certs/suite.key:/etc/ssl/private/nginx-selfsigned.key:ro
    networks:
      default:
        aliases:
          # The suite's own public name, so its redirects resolve in here.
          - localhost.emobix.co.uk
    depends_on:
      server:
        condition: service_started
      suite-cert:
        condition: service_completed_successfully

  server:
    image: registry.gitlab.com/openid/conformance-suite:latest
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: unused
      OIDC_GOOGLE_SECRET: unused
      OIDC_GITLAB_CLIENTID: unused
      OIDC_GITLAB_SECRET: unused
      JAVA_EXTRA_ARGS: -Dfintechlabs.devmode=true
    depends_on:
      - mongodb
      - tls

  # The suite's own runner, against the plan and configuration in this
  # directory. Results land in ./results.
  runner:
    image: python:3.12-slim
    profiles: ["run"]
    environment:
      CONFORMANCE_SERVER: https://localhost.emobix.co.uk:8443/
      CONFORMANCE_DEV_MODE: "1"
    volumes:
      - ${CONFORMANCE_SUITE_DIR:?a checkout of gitlab.com/openid/conformance-suite}/scripts:/suite/scripts:ro
      - ./basic.json:/plans/basic.json:ro
      - ./backchannel.json:/plans/backchannel.json:ro
      - ./frontchannel.json:/plans/frontchannel.json:ro
      - ./results:/results
    working_dir: /suite/scripts
    # Three plans, one run: the Basic OP profile, its discovery-only sibling,
    # and RP-Initiated Logout. The same static client serves all three.
    command:
      - sh
      - -c
      - >
        pip install -q -r requirements.txt &&
        python3 run-test-plan.py --export-dir /results --verbose --no-parallel
        "oidcc-basic-certification-test-plan[server_metadata=discovery][client_registration=static_client]"
        /plans/basic.json
        "oidcc-config-certification-test-plan"
        /plans/basic.json
        "oidcc-rp-initiated-logout-certification-test-plan[client_registration=static_client][response_type=code]"
        /plans/basic.json
        "oidcc-backchannel-rp-initiated-logout-certification-test-plan[client_registration=static_client][response_type=code]"
        /plans/backchannel.json
        "oidcc-frontchannel-rp-initiated-logout-certification-test-plan[client_registration=static_client][response_type=code]"
        /plans/frontchannel.json
    depends_on:
      - nginx

