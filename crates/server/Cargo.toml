[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
commons = { workspace = true, features = ["http", "request-span"] }
# Every record a handler emits lands under the request's span, and the two
# middlewares that open that span are what a binary and a test both mount.
tracing = { workspace = true }
tracing-actix-web = { workspace = true }
crypto = { workspace = true }
auth = { workspace = true }
models = { workspace = true }
store = { workspace = true }
services = { workspace = true }
# The public origin: every issuer minted and every issuer accepted is built from
# it, so the gates read the same value the binary was started with.
config = { workspace = true }
# SecretBox, so a client secret read off the wire is zeroized and redacted from
# the moment it is read rather than from where it is compared.
secrecy = { workspace = true }

actix-web = { workspace = true }
chrono = { workspace = true }
deadpool-postgres = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
# BASE64URL_NOPAD, to read the one unverified claim that says which realm's keys
# to fetch. The JOSE layer has no read that skips the signature check.
data-encoding = { workspace = true }
tokio = { workspace = true, features = ["time"] }
# Reaching out: a logout token is posted to every client that registered
# where to be told. Blocking and small, run off the request thread.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# The LDAP client lives here and nowhere else: the flow engine sees a port,
# and no other crate links a directory protocol.
cross-krb5 = { version = "0.4", default-features = false, optional = true }
ldap3 = { version = "0.11", default-features = false, features = ["tls-native"] }
# The hosted pages in every tongue they speak, rendered once at startup from
# the same strings a themed deployment would translate.
fluent-bundle = "0.15"
unic-langid = "0.9"
# The admin console, embedded at build time when the feature asks for it: one
# binary carries the whole plane. Building with the feature requires
# `pnpm --dir admin build` to have produced admin/dist first.
include_dir = { version = "0.7", optional = true }
prometheus = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
lettre = { workspace = true }
async-trait = { workspace = true }
tonic = { version = "0.14.6", optional = true }
tonic-prost = { version = "0.14.6", optional = true }
prost = { version = "0.14.4", optional = true }
tokio-stream = { version = "0.1.19", optional = true }

[features]
default = ["metrics", "otel"]
# The desktop-ticket door. Compile-gated: the GSSAPI binding links the
# system Kerberos libraries, and a deployment that does not negotiate
# should not carry them.
kerberos = ["dep:cross-krb5"]
# Serve the admin console from inside the binary, under /console. Off by
# default so a build never fails on a front nobody built.
embedded-admin = ["dep:include_dir"]
# Request metrics, scraped off the operations port. On by default; a build
# that leaves it out carries no metrics machinery at all, and the runtime
# switch is `-metrics` in SAFFUI_FEATURES.
metrics = ["dep:prometheus"]
# The mesh door: an external-authorization service a proxy calls on every
# request. Compile-gated, because a build that will never stand behind a
# proxy should carry neither the protocol machinery nor its compiler.
mesh = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tokio-stream",
        "dep:tonic-prost-build", "dep:protoc-bin-vendored"]
# Distributed tracing over OTLP. On by default, but nothing dials until an
# operator names a collector; a build that leaves it out cannot dial one at
# all, which is what an air-gapped profile wants said at link time.
otel = [
    "dep:opentelemetry",
    "dep:tracing-subscriber",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
# The in-memory half of the export pipeline, so a test can read back the
# spans a request produced and the trace they claim to belong to.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-opentelemetry = { workspace = true }
# The client half of a SPNEGO exchange, so the bench can hold a real ticket.
cross-krb5 = { version = "0.4", default-features = false }
# The binary's operator commands, driven in tests against this very server.
saffui = { path = "../saffui" }
# The LDAP front, spawned on a loopback port and driven with the same ldap3
# client the federation side already carries. The TLS pieces mint an
# ephemeral self-signed pair and accept with it, so the sealed listener is
# proved against a real handshake.
ldapfront = { path = "../ldapfront" }
openssl = { workspace = true }
tokio-openssl = { workspace = true }
services = { workspace = true }
# The public origin: every issuer minted and every issuer accepted is built from
# it, so the gates read the same value the binary was started with.
config = { workspace = true }
# SecretBox, so a client secret read off the wire is zeroized and redacted from
# the moment it is read rather than from where it is compared.
secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
# A subscriber a test can read back, to prove what a line holds and what it
# does not.
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
# The end to end plane mounts a real schema and signs real tokens, so the test
# side reaches the migration runner and the software crypto provider directly.
pgcore = { workspace = true }
tokio-postgres = { workspace = true }
actix-web = { workspace = true }
chrono = { workspace = true }
# The verifier under test doubles as the oracle: the soft authenticator's
# output is checked by the same code that will check a browser's.
webauthn-rs = { version = "0.5" }
# CBOR, which is what an attestation object and a COSE key are written in.
serde_cbor_2 = { version = "0.13" }
data-encoding = { workspace = true }

[build-dependencies]
protoc-bin-vendored = { version = "3.2.0", optional = true }
tonic-prost-build = { version = "0.14.6", optional = true }
