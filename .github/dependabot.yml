# cargo-deny already refuses a dependency with a known advisory, but it refuses
# it at the moment someone opens a pull request - which is to say, it tells us
# the tree is unsafe only once we were going to touch it anyway. These updates
# are the other half: they arrive on their own schedule, so an advisory
# published on a quiet week is answered that week rather than whenever the next
# slice happens to land.
#
# Weekly, not daily. A security product whose history is mostly bumps is a
# history nobody reads, and an unread history is where a real change hides.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The workspace pins its dependencies in one table, so a patch bump
      # rarely stands alone: it arrives with the rest of its generation. One
      # pull request per generation, and the breaking ones left to come in on
      # their own, where they can be read.
      patch-and-minor:
        update-types: [minor, patch]

  # The console and the account pages are a pnpm workspace; Dependabot reads
  # each package.json in it separately, so each one is named here.
  - package-ecosystem: npm
    directories:
      - /admin
      - /account
      - /packages/saffui-js
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: [minor, patch]

  # The actions are the one supply chain the workspace does not pin through a
  # lockfile: a tag moves and the build changes under us. They are pinned by
  # version in the workflows, and this is what moves those pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The image the product actually ships as.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
