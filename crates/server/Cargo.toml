[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
commons = { workspace = true, features = ["http", "request-span"] }
# Every record a handler emits lands under the request's span, and the two
# middlewares that open that span are what a binary and a test both mount.
tracing = { workspace = true }
tracing-actix-web = { workspace = true }
crypto = { workspace = true }
auth = { workspace = true }
models = { workspace = true }
store = { workspace = true }
services = { workspace = true }
# The public origin: every issuer minted and every issuer accepted is built from
# it, so the gates read the same value the binary was started with.
config = { workspace = true }
# SecretBox, so a client secret read off the wire is zeroized and redacted from
# the moment it is read rather than from where it is compared.
secrecy = { workspace = true }

actix-web = { workspace = true }
chrono = { workspace = true }
deadpool-postgres = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# BASE64URL_NOPAD, to read the one unverified claim that says which realm's keys
# to fetch. The JOSE layer has no read that skips the signature check.
data-encoding = { workspace = true }
tokio = { workspace = true, features = ["time"] }
# Reaching out: a logout token is posted to every client that registered
# where to be told. Blocking and small, run off the request thread.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
lettre = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
services = { workspace = true }
# The public origin: every issuer minted and every issuer accepted is built from
# it, so the gates read the same value the binary was started with.
config = { workspace = true }
# SecretBox, so a client secret read off the wire is zeroized and redacted from
# the moment it is read rather than from where it is compared.
secrecy = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
# A subscriber a test can read back, to prove what a line holds and what it
# does not.
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
# The end to end plane mounts a real schema and signs real tokens, so the test
# side reaches the migration runner and the software crypto provider directly.
pgcore = { workspace = true }
tokio-postgres = { workspace = true }
actix-web = { workspace = true }
chrono = { workspace = true }
# The verifier under test doubles as the oracle: the soft authenticator's
# output is checked by the same code that will check a browser's.
webauthn-rs = { version = "0.5" }
# CBOR, which is what an attestation object and a COSE key are written in.
serde_cbor_2 = { version = "0.13" }
data-encoding = { workspace = true }
