name: console

on:
  push:
    paths:
      - "admin/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "admin/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/console.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/saffui-js test
      - run: pnpm --dir admin exec oxlint src
      - run: pnpm --dir admin build
      - name: no em dashes
        run: "! grep -rn $'—' admin/src packages/saffui-js/src"
