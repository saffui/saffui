# cargo-deny: dependency audit (advisories, licenses, duplicates, sources).
# Run locally with `cargo deny check`; CI runs it on every push/PR.

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# One version per dependency is the workspace rule; surface accidental duplicates.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
