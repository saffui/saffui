[package]
name = "outbound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# What this deployment says to the outside: calls under the egress policy, the
# directories it asks, the messages it sends and the tellings it pushes. No web
# framework: nothing here answers a request, and the server and the scheduler
# both call it.

[dependencies]
auth = { workspace = true }
config = { workspace = true }
crypto = { workspace = true }
models = { workspace = true }
services = { workspace = true }
store = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
data-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
tracing = { workspace = true }
# Reaching out: blocking and small, run off the async threads.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Letters composed; the relay is spoken to by this crate's own client.
lettre = { workspace = true }
# The relay's TLS, from the first byte or after STARTTLS.
openssl = { workspace = true }
tokio-openssl = { workspace = true }
# The LDAP client lives here and nowhere else: the flow engine sees a port,
# and no other crate links a directory protocol.
ldap3 = { version = "0.11", default-features = false, features = ["tls-native"] }
