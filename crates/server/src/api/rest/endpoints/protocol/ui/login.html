<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<main>
  <h1>Sign in</h1>
  <form id="login" method="post" novalidate>
    <div id="credentials">
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
    </div>
    <div id="code" hidden>
      <label>One-time code
        <input name="totp" inputmode="numeric" autocomplete="one-time-code">
      </label>
    </div>
    <p id="key" hidden>Touch your security key, or use this device, to continue.</p>
    <button type="submit">Continue</button>
  </form>
  <p id="notice" role="alert" hidden></p>
</main>
<script src="login.js"></script>
</body>
</html>
