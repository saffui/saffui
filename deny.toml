[graph]
# Without this, a bare `cargo deny check` skips optional dependencies.
all-features = true

[advisories]
# A vulnerability advisory is denied by default: this file has no level for it.
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
include-build = true
include-dev = true
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
# A crate of this workspace is named by its path, without a version.
allow-wildcard-paths = true
skip = [
    { crate = "syn@2", reason = "derive_more, which actix-web builds on, and tracing-attributes still ask for syn 2. It only runs at compile time." },
]

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
