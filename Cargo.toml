[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/saffui/saffui"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
actix-rt = { version = "2.15.0", default-features = false, features = ["signal"] }
actix-web = { version = "4.15.0", default-features = false, features = ["macros"] }
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
async-trait = "0.1.92"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bcrypt = "0.19.3"
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
crypto = { path = "crates/crypto" }
cryptoki = "0.12.1"
data-encoding = "2.11.1"
deadpool-postgres = { version = "0.14.2", default-features = false, features = ["rt_tokio_1"] }
flate2 = "1.1.10"
foreign-types = "0.3.2"
futures-util = { version = "0.3.34", default-features = false }
openssl = "0.10.81"
openssl-sys = "0.9.117"
pgcore = { path = "crates/pgcore" }
postgres-openssl = "0.5.3"
proptest = "1.12.0"
regex = "1.13.1"
saffui-core = { path = "crates/saffui-core" }
secrecy = "0.10.3"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.152", default-features = false, features = ["std"] }
server = { path = "crates/server" }
store = { path = "crates/store" }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "std"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-time-0_3", "with-uuid-1"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
uuid = { version = "1.28.0", default-features = false, features = ["std"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc", "derive"] }
