[graph]
# Without this, a bare `cargo deny check` skips optional dependencies.
all-features = true

[advisories]
# A vulnerability advisory is denied by default: this file has no level for it.
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
include-build = true
include-dev = true
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    # libloading, which the optional PKCS#11 key store loads its module with.
    "ISC",
    "MIT",
    # Weak file-level copyleft. The webauthn-rs stack ships under it; consumed
    # unmodified, its obligations stop at those files and reach none of ours.
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
# A crate of this workspace is named by its path, without a version.
allow-wildcard-paths = true
skip = [
    { crate = "syn@2", reason = "derive_more, which actix-web builds on, and tracing-attributes still ask for syn 2. It only runs at compile time." },
    { crate = "wasi@0.11", reason = "mio and whoami, which the PostgreSQL driver builds on, ask for two versions of the WASI bindings. Neither is built for a target this product ships on." },
    { crate = "http@0.2", reason = "actix-web 4 is built on http 0.2, and ureq, which the command line talks to a node with, on http 1." },
    { crate = "base64@0.21", reason = "The webauthn-rs stack, which the crypto crate verifies security keys with, still asks for base64 0.21." },
    { crate = "thiserror@1", reason = "The webauthn-rs stack and the X.509 parser it reads attestations with still ask for thiserror 1." },
    { crate = "thiserror-impl@1", reason = "The derive of thiserror 1, for the same crates." },
    { crate = "synstructure@0.13", reason = "A derive helper of the ASN.1 reader under the webauthn-rs stack. It only runs at compile time." },
    { crate = "base64@0.22", reason = "postgres-protocol still asks for base64 0.22 while bcrypt, which the crypto crate verifies imported passwords with, asks for 0.23." },
]
skip-tree = [
    { crate = "proptest@1", reason = "The property tests of the crypto crate. It only runs in tests, and brings the previous generation of rand with it." },
]
# A cryptographic library is reached through the crate that owns it, so that
# one place answers for how it is used.
deny = [
    { crate = "openssl", wrappers = ["crypto", "pgcore", "postgres-openssl", "tokio-openssl", "webauthn-attestation-ca", "webauthn-rs-core"], reason = "OpenSSL is used by the crypto crate, by the WebAuthn library it verifies security keys with, and by pgcore for the TLS of the database link." },
    { crate = "openssl-sys", wrappers = ["crypto", "openssl", "tokio-openssl", "webauthn-attestation-ca", "webauthn-rs-core"], reason = "The C API of OpenSSL is reached by the crypto crate, and by the WebAuthn library under it." },
    { crate = "webauthn-rs", wrappers = ["crypto"], reason = "Security keys are verified by the crypto crate alone." },
    { crate = "argon2", wrappers = ["crypto"], reason = "Passwords are hashed by the crypto crate alone." },
    { crate = "bcrypt", wrappers = ["crypto"], reason = "Imported passwords are verified by the crypto crate alone." },
    { crate = "cryptoki", wrappers = ["crypto"], reason = "A PKCS#11 module is loaded by the crypto crate alone." },
    { crate = "postgres-openssl", wrappers = ["pgcore"], reason = "The TLS of the database link is set up by pgcore alone." },
    { crate = "tokio-openssl", wrappers = ["postgres-openssl"], reason = "It only carries the TLS of the database link." },
    { crate = "sha2", wrappers = ["postgres-protocol"], reason = "A digest of the product goes through the crypto crate; the driver hashes its own authentication." },
    { crate = "hmac", wrappers = ["postgres-protocol"], reason = "A MAC of the product goes through the crypto crate; the driver hashes its own authentication." },
    { crate = "md-5", wrappers = ["postgres-protocol"], reason = "A legacy digest the driver keeps for its own authentication." },
    { crate = "blake2", wrappers = ["argon2"], reason = "Only argon2 builds on it." },
    # The edges between the crates of the workspace, as the architecture draws them.
    { crate = "saffui-core", wrappers = ["crypto", "saffui", "saffui-core", "server", "store"], reason = "The adapters, the server and the binary build on the core; pgcore and gen-schema never do." },
    { crate = "crypto", wrappers = ["crypto", "saffui"], reason = "Only the binary binds the crypto crate to the ports of the core; the crate builds its own software key for its tests." },
    { crate = "store", wrappers = ["saffui"], reason = "Only the binary binds the store to the ports of the core." },
    { crate = "server", wrappers = ["saffui"], reason = "Only the binary mounts the server." },
    { crate = "api", wrappers = ["saffui", "server"], reason = "The contract of the administration API is shared by the server that answers and the command line that asks, and by nothing else." },
    { crate = "pgcore", wrappers = ["gen-schema", "pgcore", "saffui", "store"], reason = "The database link is shared by the binary, the store and the schema tool." },
    # A page is rendered in one place, and escapes what it shows there.
    { crate = "askama", wrappers = ["server"], reason = "The hosted pages are rendered by the server alone." },
    # A call over the network leaves from one place.
    { crate = "ureq", wrappers = ["saffui"], reason = "Only the command line calls a node; a call the product itself makes will have its own builder." },
]

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
