[package]
name = "commons"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []

# The actix rendering of a catalogued error. Off by default: everything depends
# on commons, and the reference implementation's equivalent crate pulls the web
# framework and the database driver into every one of them.
http = ["dep:actix-web", "dep:serde", "dep:serde_json", "dep:log"]

# The tracing subscriber, and the per-request span when `http` is on too. Off by
# default for the same reason: this is what a binary installs, not what a
# library needs to emit a record.
tracing-json = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-log", "dep:chrono"]

# The per-request root span. Needs both the tracing stack and the web framework,
# so it is its own feature rather than a silent consequence of enabling two.
request-span = ["http", "tracing-json", "dep:tracing-actix-web", "dep:uuid"]

[dependencies]
thiserror = { workspace = true }
secrecy = { workspace = true }
# The one engine an administrator's pattern is compiled by, so a pattern that
# is refused on the write path and one that runs at a decision are the same
# pattern under the same limits.
regex = { workspace = true }

actix-web = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
tracing-log = { workspace = true, optional = true }
tracing-actix-web = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
