name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Daily, so that an advisory published after a merge is seen.
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A version bump waits seven days after the release, the cooldown dependabot.yml already sets.
      DENY_VERSION: "0.20.2"
      # Pins the archive as it was first read, from the same origin: it does not prove that origin.
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse dependency policy bypasses
        env:
          # A new internal crate adds its manifest here by hand, in the pull request that creates it.
          INTERNAL_MANIFESTS: crates/saffui/Cargo.toml crates/server/Cargo.toml
        run: |
          # Checked before the first cargo command, so that none runs under a tracked configuration.
          configs="$(git ls-files -- ':(glob)**/.cargo' ':(glob)**/.cargo/**')"
          if [ -n "${configs}" ]; then
            echo "::error::a tracked .cargo entry can alias a check away or replace a source: ${configs}"
            exit 1
          fi
          toolchains="$(git ls-files -- ':(glob)**/rust-toolchain' ':(glob)**/rust-toolchain.toml')"
          if [ "${toolchains}" != "rust-toolchain.toml" ]; then
            echo "::error::one rust-toolchain.toml, at the root, names the toolchain, and no other toolchain file is tracked: ${toolchains}"
            exit 1
          fi
          if ! python3 -I -c 'import tomllib'; then
            echo "::error::the toolchain check needs python3 3.11 or later on the runner"
            exit 1
          fi
          # Parsed, not matched line by line: TOML can spell a path key, or keep the channel from
          # rustup, in more ways than a pattern sees. Isolated (-I): no module is taken from the
          # tree. Only the word printed at the end passes.
          verdict="$(python3 -I -c '
          import re, tomllib
          text = open("rust-toolchain.toml", "rb").read()
          plain = all(byte == 10 or 32 <= byte <= 126 for byte in text)
          document = tomllib.loads(text.decode("ascii"))
          toolchain = document["toolchain"]
          def names(value):
              return isinstance(value, list) and all(
                  isinstance(name, str) and re.fullmatch("[a-z0-9]+([_.-][a-z0-9]+)*", name)
                  for name in value
              )
          if (
              plain
              and set(document) == {"toolchain"}
              and set(toolchain) <= {"channel", "components", "targets", "profile"}
              and isinstance(toolchain["channel"], str)
              and re.fullmatch("[0-9][.](0|[1-9][0-9]{0,2})[.](0|[1-9][0-9]?)", toolchain["channel"])
              and names(toolchain.get("components", []))
              and names(toolchain.get("targets", []))
              and toolchain.get("profile", "default") in ("minimal", "default", "complete")
          ):
              print("pinned")
          ' || true)"
          if [ "${verdict}" != "pinned" ]; then
            echo "::error::rust-toolchain.toml must be TOML 1.0 in printable ASCII with LF line ends, pinning one release by its channel, with at most components, targets and a profile: anything else is refused"
            exit 1
          fi
          exceptions="$(git ls-files -- ':(glob)**/deny.exceptions.toml' ':(glob)**/.deny.exceptions.toml')"
          if [ -n "${exceptions}" ]; then
            echo "::error::license exceptions belong in deny.toml, not in a tracked cargo-deny exceptions file: ${exceptions}"
            exit 1
          fi
          # With all features, as in deny.toml: otherwise cargo leaves optional dependencies out.
          cargo metadata --locked --all-features --format-version 1 > "${RUNNER_TEMP}/metadata.json"
          outsiders="$(jq --raw-output --arg internal "${INTERNAL_MANIFESTS}" '
            .workspace_root as $root
            | .packages[]
            | select(.source == null)
            | select(.manifest_path | ltrimstr($root + "/") | IN($internal | split(" ")[]) | not)
            | "\(.name) \(.version) (\(.manifest_path))"
          ' "${RUNNER_TEMP}/metadata.json")"
          if [ -n "${outsiders}" ]; then
            echo "::error::cargo-deny cannot judge a crate taken by path, and INTERNAL_MANIFESTS does not list it: ${outsiders}"
            exit 1
          fi
      - name: Install cargo-deny
        run: |
          archive="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${archive}.tar.gz"
          echo "${DENY_SHA256}  ${RUNNER_TEMP}/${archive}.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}.tar.gz" \
            --directory "${RUNNER_TEMP}" "${archive}/cargo-deny"
          install -m 0755 "${RUNNER_TEMP}/${archive}/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"
      - run: cargo deny check -D index-failure
