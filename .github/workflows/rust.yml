name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup auto-installs the toolchain pinned in rust-toolchain.toml
      # (components included) on the first cargo invocation - no setup step.
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # chacha20 and fips-strict are off by default, so nothing above compiles
      # them. Neither gates any code yet, which is exactly when a feature rots
      # unnoticed: the first cfg written behind one would be the first thing to
      # break it. Two invocations because the pair is mutually exclusive.
      - name: features
        run: |
          cargo clippy --workspace --all-targets --features crypto/chacha20 -- -D warnings
          cargo clippy --workspace --all-targets --features crypto/fips-strict -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
