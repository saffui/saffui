# A MOSIP eSignet on this machine: the national sign-in the broker is benched
# against, and one to try by hand.
#
# eSignet 2.0.0, the mock identity system it verifies people against, their
# database, and eSignet's own sign-in page. The database is laid out by MOSIP's
# init.sql, which fetch.sh takes from their repository at the commit this rig
# was checked against.
#
#   ./fetch.sh
#   docker compose -p saffui-esignet up -d
#
# Every port is published on the host's loopback only. eSignet answers on
# 18080 rather than its usual 8080, which other local tools tend to hold.
services:
  database:
    image: postgres:17
    ports:
      - "127.0.0.1:5455:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./upstream/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-identity-system:
    image: mosipid/mock-identity-system:0.14.0
    user: root
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - container_user=mosip
      - active_profile_env=default,local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - MOSIP_ESIGNET_HOST=localhost:18080
      # The issuer this system writes into the userinfo it signs. Its local
      # profile names an older eSignet address, which a relying party that
      # checks the issuer rightly refuses.
      - MOSIP_MOCKIDENTITYSYSTEM_ESIGNET_ISSUERID=http://localhost:18080
    depends_on:
      database:
        condition: service_healthy

  esignet:
    image: mosipid/esignet:2.0.0
    user: root
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      - container_user=mosip
      - PORT=8080
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - KEYMANAGER_KEYSTORE_TYPE=PKCS12
      - KEYMANAGER_DB_SCHEMA=esignet
      - KEYMANAGER_PKCS12_FILE_PATH=/opt/mosip/test.pfx
      - KEYMANAGER_PKCS12_PASSWORD=localtest
      - KEYMANAGER_PKCS12_ALLOW_INSECURE_SOFTWARE_KEYSTORE=true
      - MOSIP_ESIGNET_CACHE_TYPE=inmemory
      - MOSIP_ESIGNET_HOST=http://localhost:18080
      - MOSIP_ESIGNET_OIDC_UI_HOSTNAME=localhost
      - MOSIP_ESIGNET_CAPTCHA_SITE_PROVIDER=hcaptcha
      # hCaptcha's published test key: it passes without a challenge.
      - MOSIP_ESIGNET_CAPTCHA_SITE_KEY=10000000-ffff-ffff-ffff-000000000001
      - MOSIP_ESIGNET_AUTHN_PROVIDER=mock
      - MOSIP_ESIGNET_MOCK_DOMAIN_URL=http://mock-identity-system:8082
    depends_on:
      database:
        condition: service_healthy
      mock-identity-system:
        condition: service_started

  esignet-ui:
    image: mosipid/oidc-ui:2.0.0
    user: root
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - container_user=mosip
      - DEFAULT_LANG=en
    volumes:
      - ./upstream/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - esignet
