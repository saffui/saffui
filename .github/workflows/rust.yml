name: rust

on:
  # A feature branch is covered by its pull request, which runs the same jobs
  # against the same commit. Listing it here as well ran everything twice per
  # push and bought nothing.
  push:
    branches: [develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    # Every job below is bounded. Nothing else bounds them: a job with no
    # timeout inherits the six hour default, so one that hangs holds a runner
    # for a working day and leaves the whole run reading as still in progress
    # rather than as broken.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5.0.1
      # rustup auto-installs the toolchain pinned in rust-toolchain.toml
      # (components included) on the first cargo invocation - no setup step.
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # Off by default, so clippy below typechecks the ChaCha20 arms without
      # running them. Gating a cipher must not stop testing it.
      - name: test with chacha20
        run: cargo test --workspace --features crypto/chacha20
      # The HTTP rendering is behind a feature so nothing that does not serve a
      # request compiles a web framework — which means nothing above runs it.
      - name: test with commons/http
        run: cargo test --workspace --features commons/http
      # The subscriber stack and the per-request span are what a binary
      # installs, so nothing above compiles them.
      - name: test with commons/request-span
        run: cargo test --workspace --features commons/request-span
      # fips-strict gates only the exclusion guard, so compiling it is all there
      # is to check. Two invocations because the pair is mutually exclusive.
      - name: features
        run: |
          cargo clippy --workspace --all-targets --features crypto/chacha20 -- -D warnings
          cargo clippy --workspace --all-targets --features crypto/pkcs11 -- -D warnings
          cargo clippy --workspace --all-targets --features commons/http -- -D warnings
          cargo clippy --workspace --all-targets --features commons/request-span -- -D warnings
          cargo clippy --workspace --all-targets --features crypto/fips-strict -- -D warnings
      # The exclusion is a compile_error!, so nothing observes it unless someone
      # builds the pair it forbids - and a guard nobody fires is a guard nobody
      # notices losing. The failure has to carry the guard's own message: a build
      # broken for any other reason would otherwise read as the guard holding.
      - name: fips-strict excludes the non-validated features
        run: |
          check() {
            if cargo build -p crypto --features "fips-strict,$1" > "$RUNNER_TEMP/guard.log" 2>&1; then
              echo "fips-strict + $1 built: the compile_error guard is gone." >&2
              exit 1
            fi
            if ! grep -q "$2" "$RUNNER_TEMP/guard.log"; then
              echo "the $1 build failed, but not on the guard:" >&2
              cat "$RUNNER_TEMP/guard.log" >&2
              exit 1
            fi
          }
          check chacha20 "incompatible with the non-FIPS 'chacha20' cipher"
          check pq-hybrid "ML-DSA and ML-KEM are not FIPS-validated"

  # ML-DSA and ML-KEM arrived in OpenSSL 3.5, and the runner image ships 3.0, so
  # the ci job above can compile this feature but cannot execute a single line
  # of it. Rather than let the tests be skipped - which reads as coverage of the
  # code that generates keys - this job builds the library it needs.
  pq:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One line to bump. Only ever linked here: nothing ships this build.
      OPENSSL_VERSION: 3.5.0
      OPENSSL_PREFIX: /opt/openssl-pq
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: Swatinem/rust-cache@v2

      - name: cache the built library
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-${{ env.OPENSSL_VERSION }}-rpath-${{ runner.os }}

      - name: build OpenSSL
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          tar xzf "openssl-$OPENSSL_VERSION.tar.gz"
          cd "openssl-$OPENSSL_VERSION"
          # The rpath is what makes the built binaries find their own
          # libraries. Without it the loader reaches the system ones first, and
          # everything below silently tests OpenSSL 3.0 instead.
          ./Configure --prefix="$OPENSSL_PREFIX" --openssldir="$OPENSSL_PREFIX/ssl" shared \
            "-Wl,-rpath,$OPENSSL_PREFIX/lib64" "-Wl,-rpath,$OPENSSL_PREFIX/lib"
          make -j"$(nproc)"
          # install_sw skips the manual pages, which are most of the install time
          # and none of the point.
          sudo make install_sw

      # The whole job rests on cargo linking the library built above rather than
      # the system one, and a silent fallback would surface as a puzzling test
      # failure. Checked here instead, where the message can say what happened.
      - name: check it is the library we think it is
        env:
          LD_LIBRARY_PATH: ${{ env.OPENSSL_PREFIX }}/lib64:${{ env.OPENSSL_PREFIX }}/lib
        run: |
          "$OPENSSL_PREFIX/bin/openssl" version
          case "$("$OPENSSL_PREFIX/bin/openssl" version)" in
            "OpenSSL $OPENSSL_VERSION"*) ;;
            *) echo "the built library is not $OPENSSL_VERSION" >&2; exit 1 ;;
          esac
          "$OPENSSL_PREFIX/bin/openssl" list -signature-algorithms | grep -q ML-DSA
          "$OPENSSL_PREFIX/bin/openssl" list -kem-algorithms | grep -q ML-KEM

      - name: test with pq-hybrid
        env:
          OPENSSL_DIR: ${{ env.OPENSSL_PREFIX }}
          LD_LIBRARY_PATH: ${{ env.OPENSSL_PREFIX }}/lib64:${{ env.OPENSSL_PREFIX }}/lib
        run: |
          cargo test --workspace --features crypto/pq-hybrid

  # The token tests are #[ignore], so a developer with no PKCS#11 module still
  # gets a green suite. That also makes them invisible: nothing runs them unless
  # something is set up to. This job is that something.
  hsm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SAFFUI_TEST_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      SAFFUI_TEST_PKCS11_PIN: "1234"
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: Swatinem/rust-cache@v2

      - name: install a PKCS#11 token
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2

          # Our own configuration and token directory, rather than the ones the
          # package lays down under /var/lib and /etc. Those belong to root, the
          # job does not, and the failure that produces is "could not load the
          # configuration" — which says nothing about permissions.
          mkdir -p "$HOME/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\n' \
            "$HOME/softhsm/tokens" > "$HOME/softhsm2.conf"
          echo "SOFTHSM2_CONF=$HOME/softhsm2.conf" >> "$GITHUB_ENV"

          SOFTHSM2_CONF="$HOME/softhsm2.conf" \
            softhsm2-util --init-token --free --label saffui-ci --pin 1234 --so-pin 1234
          SOFTHSM2_CONF="$HOME/softhsm2.conf" softhsm2-util --show-slots

          # What the token actually implements. A mechanism this store asks for
          # and the token does not have fails as "operation failed", which says
          # nothing; the list turns that into a readable diagnosis.
          SOFTHSM2_CONF="$HOME/softhsm2.conf" softhsm2-util --show-slots \
            | grep -iE "mechanism|ECDSA|RSA" || true

      # `cargo test --ignored` exits 0 when it runs nothing at all, so the count
      # is checked and not the exit status. A job that passes while testing
      # nothing is worse than no job: it reads as coverage of the private-key
      # path, which is the last place to have a blind spot.
      - name: test against the token
        run: |
          set -o pipefail
          cargo test -p crypto --features pkcs11 -- --ignored --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/hsm.log"
          if ! grep -qE "^test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/hsm.log"; then
            echo "no token test ran; the job proved nothing." >&2
            exit 1
          fi

  # The lock and the runner say nothing without a server, and the TLS modes say
  # nothing without one that negotiates TLS. Both are here rather than skipped.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAFFUI_TEST_PG: "host=localhost port=5432 user=postgres password=saffui dbname=saffui_test"
      SAFFUI_TEST_PG_TLS: "host=localhost port=5433 user=postgres password=saffui dbname=saffui_test"
      SAFFUI_TEST_PG_TLS_CERTS: /tmp/pgtls
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: saffui
          POSTGRES_DB: saffui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: Swatinem/rust-cache@v2

      # A second server, with TLS. It cannot be a service: the certificate has
      # to exist before the container starts, and a service has no step to make
      # one in. Self-signed on purpose — `require` is only distinguishable from
      # `verify-full` against a certificate that would fail verification.
      - name: start a TLS-enabled server
        run: |
          mkdir -p "$SAFFUI_TEST_PG_TLS_CERTS"
          cd "$SAFFUI_TEST_PG_TLS_CERTS"
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout server.key -out server.crt
          openssl req -new -x509 -days 1 -nodes -subj "/CN=other-ca" \
            -keyout other.key -out other.crt
          # PostgreSQL refuses a key it does not own, and the container runs as
          # its own user. Docker Desktop remaps ids and hides this; a runner
          # does not.
          sudo chown 70:70 server.key server.crt
          sudo chmod 600 server.key

          docker run -d --name saffui-pg-tls \
            -e POSTGRES_PASSWORD=saffui -e POSTGRES_DB=saffui_test -p 5433:5432 \
            -v "$SAFFUI_TEST_PG_TLS_CERTS:/certs:ro" postgres:17-alpine \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key

          for _ in $(seq 1 30); do
            docker exec saffui-pg-tls pg_isready -U postgres && break
            sleep 2
          done

          # Whatever happened, say what the server said. A container that dies
          # otherwise reports only that it is not running, which names no cause.
          if ! docker exec saffui-pg-tls psql -U postgres -tAc "SHOW ssl" | grep -qx on; then
            echo "the TLS server did not come up:" >&2
            docker logs saffui-pg-tls >&2 || true
            exit 1
          fi

      # `cargo test --ignored` exits 0 when it runs nothing, so the count is
      # checked rather than the exit status: a green job that reached no server
      # reads as coverage of the lock and the schema, which is the last place to
      # be wrong about.
      - name: test against both servers
        run: |
          set -o pipefail
          cargo test -p pgcore -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/pg.log"
          if ! grep -qE "^test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/pg.log"; then
            echo "no database test ran; the job proved nothing." >&2
            exit 1
          fi

      # The isolation the schema promises, under the role it applies to. Counted
      # for the same reason: a suite that reached no server would report the
      # tenant rules as proven.
      - name: test the schema's isolation
        run: |
          set -o pipefail
          cargo test -p store -- --include-ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/store.log"
          if [ "$(grep -cE "^test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/store.log")" -lt 18 ]; then
            echo "the isolation tests did not run; the job proved nothing." >&2
            exit 1
          fi

      # The admin plane from a request to a decision: a realm that signs, and
      # tokens it signed. This is the one suite that covers everything between
      # the bearer header and the guard's answer, which is where the plane was
      # refusing every signed token with nothing able to see it. Counted like
      # the others, since a suite that reached no server would report the whole
      # chain as proven.
      # What a request establishes about its caller, against a real schema. Same
      # counted guard as the others.
      - name: test what a request establishes
        run: |
          set -o pipefail
          cargo test -p services -- --include-ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/services.log"
          if [ "$(grep -cE "^test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/services.log")" -lt 2 ]; then
            echo "the context and decision tests did not run; the job proved nothing." >&2
            exit 1
          fi

      - name: test the admin plane end to end
        run: |
          set -o pipefail
          cargo test -p server -- --include-ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/server.log"
          if [ "$(grep -cE "^test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/server.log")" -lt 2 ]; then
            echo "the end to end plane tests did not run; the job proved nothing." >&2
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
